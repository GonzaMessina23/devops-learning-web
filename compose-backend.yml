services:
  backend:
    image: python:3-alpine
    command: ["python", "-m", "http.server", "8000"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://127.0.0.1:8000"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - app-network

  web:
    image: nginx:alpine
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
